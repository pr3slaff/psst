name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - name: Resolve selected Laravel line
        run: |
          if [ '${{ matrix.laravel }}' = '12' ]; then BENCH=10; else BENCH=11; fi
          composer update --with "laravel/framework:^${{ matrix.laravel }}.0" --with "orchestra/testbench:^${BENCH}.0" -W --no-interaction --prefer-dist
      - run: composer test
